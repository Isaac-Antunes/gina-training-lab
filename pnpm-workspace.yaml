# Lifecycle installation scripts (preinstall/postinstall) are blocked by default in pnpm 11.
# Explicitly allow only audited, strictly required native build packages; deny all others by default.
# Note: pnpm 11 ignores the legacy "pnpm.onlyBuiltDependencies" field in package.json in favor of allowBuilds here.
allowBuilds:
  # postinstall verifies the platform-native binary (and downloads it if missing). Required by Vite/tsx.
  esbuild: true
  # preinstall is a no-op ("echo 'preinstall: no-op'"). Explicitly denied.
  '@google/genai': false
  # postinstall only prints a version notice. Explicitly denied.
  protobufjs: false
